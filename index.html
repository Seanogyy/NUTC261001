<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分比寬度示範</title>
  <style>
    :root {
      --bg-1: #f3f9ff;
      --bg-2: #eaf3ff;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: #ffffff;
      --text: #11314d;
      --muted: #5a728e;
      --primary: #4956d5;
      --secondary: #6ac7ff;
      --accent: #7ee7d1;
      --border: rgba(110, 138, 182, 0.18);
      --shadow: 0 20px 45px rgba(42, 75, 120, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(106, 199, 255, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(126, 231, 209, 0.2), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .page-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(41, 70, 115, 0.06);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .brand span {
      color: var(--primary);
    }

    .nav {
      display: flex;
      gap: 28px;
      font-size: 0.96rem;
      color: var(--muted);
    }

    .nav a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s ease;
    }

    .nav a:hover {
      color: var(--primary);
    }

    .topbar button,
    .primary-btn,
    .secondary-btn {
      border: none;
      border-radius: 999px;
      padding: 0.9rem 1.5rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .topbar button,
    .primary-btn {
      background: linear-gradient(135deg, var(--primary), #6d7ef6);
      color: #fff;
      box-shadow: 0 14px 26px rgba(73, 86, 213, 0.3);
    }

    .secondary-btn {
      background: rgba(73, 86, 213, 0.08);
      color: var(--primary);
    }

    .topbar button:hover,
    .primary-btn:hover,
    .secondary-btn:hover {
      transform: translateY(-2px);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 42px;
      padding: 72px 8px 24px;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 18px;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      background: rgba(73, 86, 213, 0.08);
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.5rem, 4vw, 4.2rem);
      line-height: 1.08;
      letter-spacing: -0.06em;
    }

    .hero-copy p:not(.eyebrow) {
      margin: 0;
      max-width: 560px;
      font-size: 1.08rem;
      line-height: 1.8;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 18px;
      list-style: none;
      padding: 0;
      margin: 34px 0 0;
    }

    .stats li {
      padding: 18px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .stats strong {
      display: block;
      font-size: 1.65rem;
      line-height: 1.3;
      color: var(--text);
    }

    .stats span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .demo-card {
      position: relative;
      padding: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(230,242,255,0.8));
      border: 1px solid rgba(113, 132, 180, 0.15);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .demo-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(73,86,213,0.12), rgba(106,199,255,0.08));
      pointer-events: none;
    }

    .demo-card > * {
      position: relative;
      z-index: 1;
    }

    .demo-label {
      margin: 0 0 16px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
    }

    .level {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 18px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .parent {
      width: 80%;
      min-height: 220px;
      padding: 20px;
      margin: 0 auto;
      background: linear-gradient(135deg, #3f63d7, #4f8ef3);
      border: 3px solid rgba(255,255,255,0.35);
    }

    .child {
      width: 50%;
      min-height: 120px;
      padding: 18px 12px;
      margin-top: 20px;
      background: linear-gradient(135deg, #29b7be, #4cc7c5);
      border: 2px solid rgba(255,255,255,0.4);
    }

    .grandchild {
      width: 50%;
      min-height: 80px;
      padding: 14px 10px;
      margin-top: 16px;
      background: linear-gradient(135deg, #4fd7b3, #7ee7d1);
      border: 2px solid rgba(255,255,255,0.4);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin-top: 26px;
      padding-top: 26px;
    }

    .feature-card {
      padding: 26px 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(255,255,255,0.7);
      box-shadow: 0 14px 26px rgba(36, 66, 108, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .feature-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 35px rgba(36, 66, 108, 0.12);
    }

    .feature-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, rgba(73,86,213,0.12), rgba(106,199,255,0.2));
      color: var(--primary);
      font-size: 1.5rem;
    }

    .feature-card h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }

    .feature-card p {
      margin: 0;
      line-height: 1.7;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 48px;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-wrap: wrap;
      }

      .nav {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      .page-shell {
        padding-left: 16px;
        padding-right: 16px;
      }

      .topbar {
        padding: 16px 18px;
      }

      .nav {
        gap: 14px;
        font-size: 0.8rem;
        flex-wrap: wrap;
      }

      .actions {
        flex-direction: column;
      }

      .primary-btn,
      .secondary-btn,
      .topbar button {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">NUTC<span>Studio</span></div>
      <nav class="nav" aria-label="主要導覽">
        <a href="#about">關於</a>
        <a href="#demo">範例</a>
        <a href="#features">特色</a>
        <a href="#contact">聯絡</a>
      </nav>
      <button type="button">開始體驗</button>
    </header>

    <main class="hero" id="about">
      <div class="hero-copy">
        <p class="eyebrow">Layout Design</p>
        <h1>理解「百分比寬度」的層層關係</h1>
        <p>每一層的寬度都以自己的父元素為基準，讓排版邏輯變得更直觀、也更容易掌握比例與響應式設計。</p>

        <div class="actions">
          <button class="primary-btn" type="button">查看範例</button>
          <button class="secondary-btn" type="button">了解原理</button>
        </div>

        <ul class="stats" aria-label="比例資訊">
          <li>
            <strong>80%</strong>
            <span>父元素基準</span>
          </li>
          <li>
            <strong>50%</strong>
            <span>子元素比例</span>
          </li>
          <li>
            <strong>50%</strong>
            <span>孫元素比例</span>
          </li>
        </ul>
      </div>

      <div class="demo-card" id="demo" aria-label="百分比寬度示範區">
        <p class="demo-label">比例演示</p>
        <div class="level parent">
          <span>父元素：80%</span>
          <div class="level child">
            <span>子元素：50%</span>
            <div class="level grandchild">
              <span>孫元素：50%</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <section class="features" id="features" aria-label="網站特色">
      <article class="feature-card">
        <div class="feature-icon">✦</div>
        <h3>清楚視覺層次</h3>
        <p>利用色彩、陰影與間距，讓內容一眼就能看出層級關係與重要資訊。</p>
      </article>

      <article class="feature-card">
        <div class="feature-icon">◎</div>
        <h3>響應式排版</h3>
        <p>在不同裝置尺寸下仍保持良好閱讀體驗，讓頁面更自然、更可用。</p>
      </article>

      <article class="feature-card">
        <div class="feature-icon">▣</div>
        <h3>簡潔互動感</h3>
        <p>微妙的按鈕動態與卡片效果，提升視覺吸引力，同時不影響內容閱讀。</p>
      </article>
    </section>
  </div>
</body>
</html>
